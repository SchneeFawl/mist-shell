# editor config
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

scan_timeout = 500
command_timeout = 500

format = """
${custom.giturl}\
$git_branch\
$directory\
$git_status\
$fill\
$all\
$line_break\
➜ \
$cmd_duration\
$character\
"""

palette = "custom1"

[fill]
symbol = " "

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL="1 "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "$output"
require_repo = true
ignore_timeout = true

# branch pill
[git_branch]
symbol = "[](base)󰘬 "
style = "fg:lavender bg:base"
format =  "  on [$symbol$branch]($style)[](base) "

# git status stuff
[git_status]
format = "[ $staged$modified$renamed$deleted$untracked$conflicted$ahead_behind ]($style)"

staged = "[+${count} ](green)"
modified = "[!${count} ](yellow)"
renamed = "[󱞯${count} ](blue)"
deleted = "[-${count} ](red_ochre)"
untracked = "[?${count} ](ash_grey)"
ahead = "[⇡${count} ](peach)"
conflicted = "[${count} ](red_ochre)"
behind = "[⇣${count} ](ash_grey2)"
stashed = "[${count} ](lavender)"

[directory]
format = "[$path ]($style)"
truncation_length = 4

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[ ](bold fg:green)"
error_symbol = "[✘ ](bold fg:red)"

[cmd_duration]
format = " [](bold fg:252)[󰞌 $duration](bold bg:252 fg:235)[](bold fg:252) "

[python]
format = "via [${symbol}(${virtualenv}) ${version}]($style)"
style = "bold bright-yellow"
symbol = "[ ](bold bright-blue)"
version_format = "${raw}"

[lua]
format = "via [${symbol} ${version}]($style)"
style = "bold bright-blue"
symbol = " "
version_format = "${raw}"

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
format = "via [${symbol} ${version}]($style)"
style = "bold bright-green"
symbol = " "
version_format = "${raw}"

[rust]
style = "bold bright-red"
format = "via [${symbol}]($style)"
symbol = " "
detect_files = ["Cargo.toml"]

[swift]
format = "via [${symbol}]($style)"
style = "bold bright-red"
symbol = " "
version_format = "${raw}"

[c]
style = "bold bright-cyan"
format = "via [$symbol(-$name)]($style)"
symbol = " "

[cpp]
style = "bold bright-cyan"
format = "via [$symbol]($style)"
symbol = " "

[kotlin]
format = "via [$symbol]($style)"
style = "bold bright-red"
symbol = " "

[perl]
format = "via [perl](italic) [$symbol]($style)"
style = "bold bright-cyan"
symbol = " "

[java]
style = "bold bright-red"
format = "via [${symbol}]($style)"
symbol = " "

[kubernetes]
style = "bold bright-cyan"
format = "via [kubernetes](italic) [$symbol]($style)"
symbol = " "

[dotnet]
style = "bold bright-red"
format = "via [dotnet](italic) [$symbol]($style)"
symbol = " "

[nix_shell]
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
style = 'bold italic dimmed blue'
symbol = ' '
unknown_msg = '[◌](bold dimmed ellow)'


[palettes.custom1]
base = "#1e1e2e"
lavender = "#b4befe"
peach = "#f0bb99"
teal = "#9efcff"
ash_grey = "#cbd0b9"
ash_grey2 = "#bddbd0"
red_ochre = "#c54326"

